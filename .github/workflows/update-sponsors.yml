name: Automatically Update Sponsors Wall of Honor

on:
  sponsorship:
    types: [created, edited, cancelled, tier_changed]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sponsors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Sponsors Update Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python .github/scripts/update_sponsors.py

      - name: Commit and Push Updates to Wall of Honor
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add wiki/Wall-of-Honor.md
          if git diff --staged --quiet; then
            echo "No changes detected in Wall of Honor."
          else
            git commit -m "docs(sponsors): automatically update Wall of Honor sponsors [skip ci]"
            git push origin HEAD:main
            echo "Successfully updated Wall of Honor!"
          fi
