name: CI & Security

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 6 * * 1' # Weekly security scan on Mondays
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: read
  security-events: write

env:
  ACTIONS_AUDIT_NODE_VERSION: 'false'
  ACTIONS_SILENCE_DEPRECATED_NODE_VERSION_WARNING: 'true'

jobs:
  build-and-scan:
    name: Build & CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d -i debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/**/*.apk

  build-release:
    name: Build Release Package
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Release Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: gradle :app:assembleRelease

      - name: Rename APKs with Architecture Tags
        run: |
          mkdir -p app/build/outputs/apk/release/combined
          VERSION="${{ github.event.inputs.release_version }}"
          if [ -z "$VERSION" ]; then
            VERSION="1.3.0"
          fi
          
          for apk in $(find app/build/outputs/apk/release -name "*.apk"); do
            if [ -f "$apk" ]; then
              filename=$(basename "$apk")
              if echo "$filename" | grep -q "arm64-v8a"; then
                cp "$apk" "app/build/outputs/apk/release/combined/secure-dialer-${VERSION}-arm64-v8a.apk"
              elif echo "$filename" | grep -q "armeabi-v7a"; then
                cp "$apk" "app/build/outputs/apk/release/combined/secure-dialer-${VERSION}-armeabi-v7a.apk"
              elif echo "$filename" | grep -q "x86_64"; then
                cp "$apk" "app/build/outputs/apk/release/combined/secure-dialer-${VERSION}-x86_64.apk"
              elif echo "$filename" | grep -q "x86"; then
                cp "$apk" "app/build/outputs/apk/release/combined/secure-dialer-${VERSION}-x86.apk"
              elif echo "$filename" | grep -q "universal"; then
                cp "$apk" "app/build/outputs/apk/release/combined/secure-dialer-${VERSION}-universal.apk"
              else
                cp "$apk" "app/build/outputs/apk/release/combined/secure-dialer-${VERSION}.apk"
              fi
            fi
          done

      - name: Generate SHA-256 Checksums
        run: |
          cd app/build/outputs/apk/release/combined
          sha256sum *.apk > checksums.txt

      - name: Extract Release Notes
        run: |
          sed -n '/## \[/,/## \[/p' CHANGELOG.md | sed '1d;$d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            grep -A 1000 "## \[" CHANGELOG.md | sed '1d' > release_notes.md
          fi

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_version }}
          name: Release ${{ github.event.inputs.release_version }}
          body_path: release_notes.md
          generate_release_notes: false
          files: |
            app/build/outputs/apk/release/combined/*.apk
            app/build/outputs/apk/release/combined/checksums.txt
