name: Sync Wiki to GitHub Wiki

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Sync Wiki Files to GitHub Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting Wiki Auto-Sync..."
          
          # Clone the repository's native GitHub Wiki
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          
          git clone "$WIKI_URL" wiki_git || {
            echo "::error::Could not clone the GitHub Wiki repository."
            echo "::notice::Ensure Wiki feature is enabled in GitHub Repo Settings -> Features -> Wikis, and at least one initial page (e.g. Home) is created in the GitHub Wiki UI."
            exit 1
          }

          # Copy all pages and sidebar configuration from /wiki/ folder
          rsync -av --delete --exclude='.git' wiki/ wiki_git/

          cd wiki_git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected in Wiki pages."
          else
            git commit -m "docs(wiki): auto-sync wiki content from repository [skip ci]"
            git push origin HEAD
            echo "Successfully synced Wiki pages to GitHub Wiki!"
          fi
