name: Feature Request
description: Suggest an idea or enhancement for Secure Dialer
title: "[ENHANCEMENT]: "
labels: ["enhancement", "feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide details about your proposed enhancement.
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? Please describe concisely.
      placeholder: "I'm frustrated when..."
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or feature you would like to see added.
      placeholder: "Add an option to..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you've considered.
    validations:
      required: false
  - type: textarea
    id: privacy-alignment
    attributes:
      label: Zero-Internet & Privacy Alignment
      description: How does this feature work 100% offline without needing internet access or remote servers?
      placeholder: "This feature uses local SQLite / Android APIs strictly on-device..."
    validations:
      required: true
  - type: textarea
    id: visual-mockups
    attributes:
      label: Visual Mockups / References
      description: If you have UI design sketches or examples from other FOSS apps, attach them here.
    validations:
      required: false
